/* hero orb (welcome page). Every radius is computed, never hand-typed, so the
   arcs sit exactly on the rings they trace. Two arcs that TOGETHER complete a
   ring, and two companions travelling side by side on one thread: 共に.
   The gaussian bloom is a DARK-theme effect -- on white a blur reads as a
   smudge, so light gets a crisp wide halo stroke instead. */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;align-items:center}
.hero .orb{width:320px;justify-self:end;color:var(--accent)}
.hero .orb svg{width:100%;height:auto;display:block;overflow:visible}
.o-ring{fill:none;stroke:var(--line);stroke-width:1}
.o-ring-ac{fill:none;stroke:var(--accent);stroke-width:1;opacity:.28}
.o-dash{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 16;opacity:.45}
.o-dash2{fill:none;stroke:var(--accent-mid);stroke-width:1;stroke-dasharray:3 9;opacity:.7}
.o-ticks line{stroke:var(--accent-mid);stroke-width:1.5;opacity:.55}
.o-arc{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.o-arc-halo{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;opacity:.13}
.o-thread{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.85}
.o-dot{fill:var(--accent)}
.o-dot3{fill:var(--accent);opacity:.65}
.o-core{fill:var(--accent)}
.o-core-halo{fill:var(--accent);opacity:.14}
.o-spin-slow,.o-spin-mid,.o-spin-fast,.o-spin-rev,.o-pair,.o-s3,.o-core,.o-core-halo{
  transform-box:view-box;transform-origin:160px 160px}
.o-spin-slow{animation:o-turn 46s linear infinite reverse}
.o-spin-mid{animation:o-turn 30s linear infinite}
.o-spin-fast{animation:o-turn 14s linear infinite}
.o-spin-rev{animation:o-turn 18s linear infinite reverse}
.o-pair{animation:o-turn 11s linear infinite}
.o-s3{animation:o-turn 34s linear infinite reverse}
.o-core{animation:o-beat 5s ease-in-out infinite}
.o-core-halo{animation:o-halo 5s ease-in-out infinite}
@keyframes o-turn{to{transform:rotate(360deg)}}
@keyframes o-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes o-halo{0%,100%{transform:scale(1);opacity:.14}50%{transform:scale(1.18);opacity:.24}}
:root[data-theme="dark"] .o-lit{filter:url(#oglow)}
:root[data-theme="dark"] .o-core{filter:url(#ocore)}
:root[data-theme="dark"] .o-arc-halo{opacity:0}
:root[data-theme="dark"] .o-core-halo{opacity:0;animation:none}
@media (prefers-reduced-motion:reduce){
  .o-spin-slow,.o-spin-mid,.o-spin-fast,.o-spin-rev,.o-pair,.o-s3,.o-core,.o-core-halo{animation:none}
}
